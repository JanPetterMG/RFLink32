name: Dependabot Updates PlatformIO

on:
  schedule:
    - cron: 3 2 1 * *

  workflow_dispatch:

permissions:
  contents: read

jobs:
  platformio:
    name: Update PlatformIO dependencies
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: PlatformIO Dependency Updater
        uses: VIPnytt/platformio-dependency-updater@2cfb0b4ff099f20e5e068253dc97fc8671c470c9 # v1.0.0
